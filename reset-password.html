<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAGLE WRITES — Reset Password</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #061222;
        }

        .reset-box {
            width: 100%;
            max-width: 430px;
            margin: 20px;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        .brand {
            text-align: center;
            color: #0B1F3A;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #0B1F3A;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #F4C430;
            color: #061222;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="reset-box">

    <div class="brand">EAGLE WRITES</div>

    <div class="subtitle">Create a new admin password</div>

    <form id="reset-form">

        <label for="password">New Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            required
            minlength="6"
        >

        <label for="confirm-password">Confirm Password</label>

        <input
            type="password"
            id="confirm-password"
            placeholder="Confirm new password"
            required
            minlength="6"
        >

        <button type="submit">Update Password</button>

    </form>

    <div id="message"></div>

</div>

<script>
    const SUPABASE_URL = 'https://ekkvghdnejvyjykagafr.supabase.co';

    const SUPABASE_ANON_KEY = 'sb_publishable_Ih6_PG5YhHoW9zhlhZddsg_Z9zwrn1h';

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const form = document.getElementById('reset-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async function(event) {

        event.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword =
            document.getElementById('confirm-password').value;

        if (password !== confirmPassword) {
            message.textContent = 'Passwords do not match.';
            message.style.color = '#b42318';
            return;
        }

        const { error } = await supabaseClient.auth.updateUser({
            password: password
        });

        if (error) {
            console.error(error);
            message.textContent =
                'Unable to update password. Please try the reset link again.';
            message.style.color = '#b42318';
            return;
        }

        message.textContent =
            'Password updated successfully. You can now log in to the admin dashboard.';
        message.style.color = '#067647';

        form.reset();

        setTimeout(() => {
            window.location.href = 'admin.html';
        }, 2000);
    });
</script>

</body>
</html>
